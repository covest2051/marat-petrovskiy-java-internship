spring:
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://authentication-service:8081
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/user/**, /users, /users/**, /cards, /cards/**, /internal/users
            - Method=GET,POST,PUT,DELETE
          filters:
            - RewritePath=/user/(?<remaining>.*), /users/${remaining}

        - id: order-service
          uri: http://order-service:8082
          predicates:
            - Path=/orders/**, /orders
            - Method=GET,POST,PUT,DELETE

        - id: payment-service
          uri: http://payment-service:8083
          predicates:
            - Path=/payments/**, /payments
            - Method=GET,POST,PUT,DELETE
          filters:
            - StripPrefix=0
    compatibility-verifier:
      enabled: false
    refresh:
      enabled: false
security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:619296d21b477d598dc0dc0ec8eec349}
    exclude-paths:
      - /auth/login
      - /auth/register
      - /auth/health

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    prometheus:
      enabled: false

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG