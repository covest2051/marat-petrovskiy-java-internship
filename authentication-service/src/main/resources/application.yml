spring:
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
  application:
    name: authentication-service
  datasource:
    url: jdbc:postgresql://java-internship-postgres:5432/innowisedb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:false}
  cache:
    type: redis
    redis:
      time-to-live: 10m
  data:
    redis:
      host: redis
      timeout: 2000ms
      port: 6379

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

security:
  jwt:
    secret: 619296d21b477d598dc0dc0ec8eec349
    access-expiration-ms: 900000
    refresh-expiration-ms: 2592000000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE